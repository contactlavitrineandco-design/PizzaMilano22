# GitHub → Supabase : applique la base de données du site Pizza Milano.
#
# Se déclenche à chaque envoi sur main qui touche aux migrations, ou à la main
# (onglet Actions > « Supabase : base de données » > Run workflow).
#
# Réglages à faire une seule fois dans GitHub (Settings > Secrets and variables > Actions) :
#   Secrets   : SUPABASE_ACCESS_TOKEN  (supabase.com > Account > Access Tokens)
#               SUPABASE_DB_PASSWORD   (mot de passe de la base, choisi à la création du projet)
#   Variables : SUPABASE_PROJECT_ID    (Project Settings > General > Project ID)
# Tant que SUPABASE_PROJECT_ID n'est pas renseigné, le workflow ne fait rien.
# Aucun secret n'est écrit dans le dépôt ni affiché dans les journaux.
name: "Supabase : base de données"

on:
  push:
    branches: [main]
    paths:
      - "Pizza Milano/création de site web/supabase/**"
  workflow_dispatch:
    inputs:
      deja_appliquees:
        description: "Base déjà créée à la main (SQL Editor) : marquer les migrations existantes comme appliquées avant d'envoyer les nouvelles"
        type: boolean
        default: false
      donnees_initiales:
        description: "Envoyer aussi seed.sql (uniquement pour une base vide : la carte du gérant serait sinon complétée)"
        type: boolean
        default: false

concurrency:
  group: supabase-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrations:
    if: ${{ vars.SUPABASE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    defaults:
      run:
        working-directory: "Pizza Milano/création de site web"
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Relier le projet Supabase
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Marquer les migrations déjà appliquées à la main
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deja_appliquees }}
        run: |
          versions=$(ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1)
          supabase migration repair --status applied $versions --password "$SUPABASE_DB_PASSWORD"

      - name: Migrations en attente
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"

      - name: Appliquer les migrations
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.donnees_initiales }}" = "true" ]; then
            supabase db push --include-seed --password "$SUPABASE_DB_PASSWORD"
          else
            supabase db push --password "$SUPABASE_DB_PASSWORD"
          fi
